<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Diamond Plus | Alışveriş</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h1>💎 DIAMOND PLUS</h1>
    <p>Premium Ürünler | 💲 Dolar Fiyatları</p>
</div>

<div class="discount-banner" id="discountBanner">
    🏷️ İNDİRİM FIRSATI! Tıkla, kaçırma! 🔥
</div>

<div class="search-filter">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Ürün ara...">
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">📦 Tüm Ürünler</button>
        <button class="filter-btn" data-filter="discount">🏷️ İndirimdekiler</button>
    </div>
</div>

<div id="giftBoxContainer"></div>

<div id="recentSection" style="display:none;">
    <div class="section-title">👁️ EN SON BAKTIKLARINIZ</div>
    <div id="recentProducts" class="recent-products"></div>
</div>

<div class="section-title">🔥 POPÜLER ÜRÜNLER</div>
<div id="productsContainer" class="products-grid">Ürünler yükleniyor...</div>

<div class="cart-float" id="cartFloat">
    <span class="cart-icon">🛒</span>
    <span class="cart-count" id="cartCount">0</span>
</div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🛍️ Sepetim</h3>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <ul id="cartModalItems" class="cart-items-list"><li>Sepetiniz boş</li></ul>
        <div id="cartModalTotal" class="cart-total">Toplam: $0</div>
        <button id="whatsappOrderBtn" class="whatsapp-order">📲 WhatsApp ile Sipariş Gönder</button>
    </div>
</div>

<div id="quickviewModal" class="quickview-modal">
    <div class="quickview-close" id="quickviewClose">&times;</div>
    <div class="quickview-content">
        <img id="quickviewImg" class="quickview-img" src="">
        <div class="quickview-info">
            <div class="quickview-name" id="quickviewName"></div>
            <div class="quickview-price" id="quickviewPrice"></div>
            <div class="quickview-similar">
                <div class="quickview-similar-title">🔍 BUNLARA DA BAKTILAR</div>
                <div id="similarProducts" class="similar-products"></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
